name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -q . pytest
      - name: Tests
        run: pytest -q
      - name: CLI smoke test (demo network)
        run: |
          nyxnet --version
          nyxnet --demo --plain -n 3 -i 0 --demo-speed 20

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q . pyinstaller
      - name: Build nyxnet.exe
        run: pyinstaller --onefile --console --name nyxnet-windows-x64 --collect-data stem packaging/nyxnet_entry.py
      - name: Smoke test the exe
        run: |
          dist\nyxnet-windows-x64.exe --version
          dist\nyxnet-windows-x64.exe --demo --plain -n 2 -i 0 --demo-speed 20
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: nyxnet-windows-x64
          path: dist/nyxnet-windows-x64.exe

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  release:
    if: github.event_name == 'push'
    needs: [test, package, windows-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(grep -oP '__version__ = "\K[^"]+' nyxnet/__init__.py)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" != refs/tags/* ]] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "$tag already released"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "new release: $tag"
          fi

      - if: steps.ver.outputs.new == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NyxNet ${{ steps.ver.outputs.tag }}
          files: dist/*
          generate_release_notes: true
